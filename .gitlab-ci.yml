image: node:18

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - npm install -g npm@latest
  - npm install

build_app:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

deploy_to_s3:
  stage: deploy
  image: python:3.10
  dependencies:
    - build_app
  before_script:
    - pip install awscli
  script:
    - aws s3 sync out/ s3://$S3_BUCKET/ --delete
  only:
    - main
